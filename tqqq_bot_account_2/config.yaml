name: V7_tqqq_bot_account_2
version: 0.1.63
slug: tqqq_bot_account_2
description: TQQQ automated trading bot for an independent IBKR account_2
arch:
- amd64
startup: application
timeout: 60
boot: manual
options:
  account:
    trading_mode: paper
    ibkr_account_id: DU1234567
    ibkr_username: placeholder_user
    ibkr_password: placeholder_password
    dry_run: true
    readonly_api: true
  google_sheet:
    google_sheet_id: your_google_sheet_id_here
    google_credentials_json: ''
  strategy:
    enable_bridge_anchor: true
    anchor_buy_offset: 1.5
    bridge_max_auto_trim_shares: 5
    share_mismatch_mode: halt
    max_spread_pct: 0.5
  schedule:
    timezone: America/Denver
    maintenance_enabled: true
    maintenance_start_local: '23:44'
    maintenance_end_local: '00:00'
    maintenance_cancel_open_orders: true
    gateway_auto_restart_enabled: true
    gateway_auto_restart_time: '23:48'
    weekend_pause_enabled: true
    weekend_pause_start_friday: '18:15'
    weekend_pause_end_sunday: '09:00'
  notifications:
    enabled: false
    webhook_url: ""
    notify_on_fills: false
    notify_on_startup_ok: false
    notify_on_order_submit: false
    notify_on_halts: false
    notify_on_bridge_halt: false
    notify_on_reanchor_stalled: false
    notify_on_share_mismatch: false
    notify_on_share_mismatch_cleared: false
    notify_on_gateway_login: false
    notify_on_watchdog_restart: false
    notify_on_errors: false
    timeout_seconds: 3.0
    dedupe_window_seconds: 300
    error_alert_delay_seconds: 600
  advanced:
    ibkr_port: 7497
    ibkr_client_id: 1
    poll_interval_seconds: 60
    heartbeat_interval_seconds: 60
    health_log_interval_seconds: 300
    maintenance_reconnect_grace_minutes: 30
    gateway_live_wait_timeout_seconds: 3600
    gateway_paper_wait_timeout_seconds: 300
    mask_account_ids_in_logs: true
    enable_vnc: false
    vnc_port: 5900
schema:
  account:
    trading_mode: list(paper|live)
    ibkr_account_id: str
    ibkr_username: str
    ibkr_password: password
    dry_run: bool
    readonly_api: bool
  google_sheet:
    google_sheet_id: str
    google_credentials_json: password
  strategy:
    enable_bridge_anchor: bool
    anchor_buy_offset: float(0,)
    bridge_max_auto_trim_shares: int(0,)
    share_mismatch_mode: list(halt|warn)
    max_spread_pct: float(0,)
  schedule:
    timezone: list(America/New_York|America/Chicago|America/Denver|America/Phoenix|America/Los_Angeles|America/Anchorage|Pacific/Honolulu)
    maintenance_enabled: bool
    maintenance_start_local: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
    maintenance_end_local: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
    maintenance_cancel_open_orders: bool
    gateway_auto_restart_enabled: bool
    gateway_auto_restart_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
    weekend_pause_enabled: bool
    weekend_pause_start_friday: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
    weekend_pause_end_sunday: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  notifications:
    enabled: bool
    webhook_url: password
    notify_on_fills: bool
    notify_on_startup_ok: bool
    notify_on_order_submit: bool
    notify_on_halts: bool
    notify_on_bridge_halt: bool
    notify_on_reanchor_stalled: bool
    notify_on_share_mismatch: bool
    notify_on_share_mismatch_cleared: bool
    notify_on_gateway_login: bool
    notify_on_watchdog_restart: bool
    notify_on_errors: bool
    timeout_seconds: float(0,)
    dedupe_window_seconds: int(0,)
    error_alert_delay_seconds: int(0,)
  advanced:
    ibkr_port: port
    ibkr_client_id: int(0,)
    poll_interval_seconds: int(1,)
    heartbeat_interval_seconds: int(1,)
    health_log_interval_seconds: int(1,)
    maintenance_reconnect_grace_minutes: int(0,)
    gateway_live_wait_timeout_seconds: int(1,)
    gateway_paper_wait_timeout_seconds: int(1,)
    mask_account_ids_in_logs: bool
    enable_vnc: bool
    vnc_port: port
ports:
  5900/tcp: null
